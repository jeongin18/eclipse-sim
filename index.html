<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="고1 한국 현대사: 부마 민주 항쟁과 유신 체제 붕괴의 관계를 사료로 탐구하는 활동">
<title>1979 부마, 그 열흘</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 사건 기록철 — 상단 단계 탭, 가운데 단일 열(최대 920px), 사료는 출처 띠가 붙은 문서 카드.
   색: 등사 잉크(시민·학생 사료) / 관인 붉은색(국가 사료) / 황토(권력 내부자) / 녹색(교사 해설) */
:root{
  --paper:#f2f3f0; --sheet:#fbfbf9; --ink:#1c2130; --muted:#5a606d; --rule:#d3d6cf;
  --violet:#4a3d9a; --violet-soft:#e7e4f5;
  --state:#9a3626; --state-soft:#f5e4df;
  --ochre:#7f6110; --ochre-soft:#f2ead3;
  --teacher:#25664a; --teacher-soft:#dcefe5;
  --warn:#8a5a00; --ok:#25664a;
  --f-display:"Nanum Myeongjo","Noto Serif KR","Batang",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --base:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#14161c; --sheet:#1c1f27; --ink:#e6e7ec; --muted:#a2a7b3; --rule:#343846;
  --violet:#b0a4f2; --violet-soft:#2a2645; --state:#ec9a87; --state-soft:#3a2420;
  --ochre:#dcb75c; --ochre-soft:#342c17; --teacher:#77d3a5; --teacher-soft:#1a3328;
  --warn:#e7b558; --ok:#77d3a5; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#14161c; --sheet:#1c1f27; --ink:#e6e7ec; --muted:#a2a7b3; --rule:#343846;
  --violet:#b0a4f2; --violet-soft:#2a2645; --state:#ec9a87; --state-soft:#3a2420;
  --ochre:#dcb75c; --ochre-soft:#342c17; --teacher:#77d3a5; --teacher-soft:#1a3328;
  --warn:#e7b558; --ok:#77d3a5; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
img,svg{max-width:100%}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:var(--base);line-height:1.7;margin:0}
body.big{--base:20px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
a{color:var(--violet)}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
button{font:inherit;cursor:pointer}
.wrap{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--rule)}
.hrow{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.15em;letter-spacing:-.01em;margin-right:auto}
.brand small{font-family:var(--f-mono);font-weight:400;font-size:.62em;color:var(--muted);margin-left:8px;letter-spacing:.04em}
.tbtn{border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:6px;padding:4px 10px;font-size:.85em}
.tbtn[aria-pressed="true"]{background:var(--teacher-soft);border-color:var(--teacher);color:var(--teacher)}
.tbadge{font-size:.78em;font-weight:600;color:var(--teacher);background:var(--teacher-soft);border-radius:999px;padding:2px 10px}
nav.steps{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
nav.steps button{flex:0 0 auto;border:0;background:transparent;color:var(--muted);padding:8px 12px 6px;border-bottom:3px solid transparent;font-size:.92em;white-space:nowrap}
nav.steps button .n{font-family:var(--f-mono);font-size:.8em;margin-right:6px}
nav.steps button[aria-current="step"]{color:var(--ink);border-bottom-color:var(--violet);font-weight:600}
nav.steps button.done .n::after{content:" ✓";color:var(--ok)}

main{padding-block:28px 64px}
section.step{display:grid;gap:22px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;line-height:1.35;text-wrap:balance;margin:0}
h1{font-size:2em}
h2{font-size:1.45em}
h3{font-size:1.12em}
.eyebrow{font-family:var(--f-mono);font-size:.78em;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.lead{font-size:1.06em;max-width:62ch;margin:0}
p{margin:0;max-width:66ch}

/* inquiry */
.inquiry{border-top:2px solid var(--ink);border-bottom:1px solid var(--rule);padding-block:22px;display:grid;gap:10px}
.inquiry q{font-family:var(--f-display);font-weight:800;font-size:1.65em;line-height:1.4;quotes:none;text-wrap:balance}

/* forms */
.field{display:grid;gap:6px}
label,.lab{font-weight:600;font-size:.95em}
.hint{font-size:.85em;color:var(--muted)}
input[type=text],textarea,select{font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:10px 12px;width:100%}
textarea{min-height:110px;resize:vertical;line-height:1.6}
textarea:focus,input:focus,select:focus{border-color:var(--violet);outline:none;box-shadow:0 0 0 3px var(--violet-soft)}
.idrow{display:grid;grid-template-columns:1fr 1fr 2fr;gap:12px}
@media (max-width:520px){.idrow{grid-template-columns:1fr 1fr}.idrow .field:last-child{grid-column:1/-1}}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:8px 16px}
.choice[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:var(--sheet)}
.count{font-family:var(--f-mono);font-size:.75em;color:var(--muted);text-align:right}

/* timeline */
.tl{position:relative;display:grid;gap:0;padding-left:28px}
.tl::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--rule)}
.ev{position:relative;padding:8px 0 14px}
.ev::before{content:"";position:absolute;left:-24px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--sheet);border:2px solid var(--muted)}
.ev.key::before{background:var(--state);border-color:var(--state)}
.ev.end::before{background:var(--ink);border-color:var(--ink)}
.ev button.evh{display:flex;gap:14px;align-items:baseline;background:none;border:0;padding:0;color:var(--ink);text-align:left;width:100%}
.ev time{font-family:var(--f-mono);font-size:.85em;color:var(--muted);flex:0 0 7.2em;font-variant-numeric:tabular-nums}
.ev .t{font-weight:600}
.ev .t::after{content:"  +";color:var(--muted);font-weight:400}
.ev[open-ev] .t::after{content:"  −"}
.ev .detail{margin:8px 0 0 calc(7.2em + 14px);font-size:.95em;display:grid;gap:6px}
@media (max-width:520px){.ev button.evh{flex-direction:column;gap:0}.ev .detail{margin-left:0}}

/* map */
.mapwrap{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:720px){.mapwrap{grid-template-columns:1fr}}
.map{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:8px;overflow-x:auto}
.map svg{display:block;width:100%;height:auto;min-width:300px}
.map .land{fill:var(--paper);stroke:var(--rule);stroke-width:1.5}
.map .sea{fill:var(--violet-soft)}
.map text{fill:var(--ink);font-family:var(--f-body);font-size:13px}
.map text.area{font-family:var(--f-display);font-weight:800;font-size:17px;fill:var(--muted)}
.map text.small{font-size:11px;fill:var(--muted)}
.map .pin{cursor:pointer}
.map .pin circle{fill:var(--state);stroke:var(--sheet);stroke-width:2}
.map .pin.cit circle{fill:var(--violet)}
.map .pin:focus-visible circle,.map .pin.on circle{stroke:var(--ink);stroke-width:3}
.placebox{border-left:3px solid var(--violet);padding:4px 0 4px 14px;display:grid;gap:6px;min-height:120px}

/* source cards */
.cards{display:grid;gap:20px}
.doc{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;display:grid}
.doc .band{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--rule);font-size:.85em}
.doc .tag{font-weight:600;border-radius:3px;padding:1px 8px;font-size:.92em}
.doc.state .tag{background:var(--state-soft);color:var(--state)}
.doc.citizen .tag{background:var(--violet-soft);color:var(--violet)}
.doc.insider .tag{background:var(--ochre-soft);color:var(--ochre)}
.doc.history .tag{background:var(--paper);color:var(--muted);border:1px solid var(--rule)}
.doc .meta{font-family:var(--f-mono);font-size:.92em;color:var(--muted)}
.doc .body{padding:16px;display:grid;gap:12px}
.doc .body h3{display:flex;gap:10px;align-items:baseline}
.doc .body h3 .letter{font-family:var(--f-mono);font-size:.8em;color:var(--muted)}
.doc .text{display:grid;gap:8px}
.doc .text ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.orig{border:1px dashed var(--rule);border-radius:4px;padding:12px 14px;display:grid;gap:8px;font-size:.94em}
.orig blockquote{margin:0;font-family:var(--f-display);font-weight:700;padding-left:12px;border-left:3px solid var(--muted)}
.linkbtn{background:none;border:0;color:var(--violet);padding:0;text-decoration:underline;text-underline-offset:3px;font-size:.92em;justify-self:start}
.srcs{font-size:.84em;color:var(--muted);display:grid;gap:3px;border-top:1px solid var(--rule);padding-top:10px}
.srcs a{word-break:break-all}
.st{font-weight:600;white-space:nowrap}
.st.ok{color:var(--ok)} .st.warn{color:var(--warn)}
.sourcing{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;font-size:.88em}
@media (max-width:620px){.sourcing{grid-template-columns:1fr 1fr}}
.sourcing div{background:var(--paper);border-radius:4px;padding:8px 10px}
.sourcing b{display:block;font-size:.85em;color:var(--muted);font-weight:500}

/* compare */
.vs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:620px){.vs{grid-template-columns:1fr}}
.side{border-top:4px solid var(--rule);background:var(--sheet);padding:14px 16px;display:grid;gap:8px;align-content:start}
.side.state{border-top-color:var(--state)} .side.citizen{border-top-color:var(--violet)} .side.insider{border-top-color:var(--ochre)} .side.history{border-top-color:var(--muted)}
.side h3{font-size:1em}
.side ul{margin:0;padding-left:1.2em;display:grid;gap:4px;font-size:.95em}
.part{display:grid;gap:14px;padding-top:8px}

/* connect */
.chain{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--rule);background:var(--sheet)}
@media (max-width:680px){.chain{grid-template-columns:1fr 1fr}}
.chain div{padding:12px 14px;border-right:1px solid var(--rule);display:grid;gap:4px;align-content:start}
.chain div:last-child{border-right:0}
.chain .y{font-family:var(--f-mono);font-size:.85em;color:var(--muted)}
.chain .nm{font-family:var(--f-display);font-weight:800}
.chain .here{background:var(--violet-soft)}
.chain p{font-size:.9em}

/* teacher */
.tnote{background:var(--teacher-soft);border-left:4px solid var(--teacher);padding:14px 16px;display:grid;gap:8px;font-size:.95em}
.tnote h3{color:var(--teacher);font-size:1em;font-family:var(--f-body);font-weight:600}
.tnote ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.tnote[hidden]{display:none!important}

/* nav / submit */
.pager{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--rule);padding-top:18px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--sheet);border-radius:6px;padding:10px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.rubric{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;font-size:.9em}
@media (max-width:620px){.rubric{grid-template-columns:1fr}}
.rubric div{border:1px solid var(--rule);border-radius:4px;padding:10px 12px;background:var(--sheet)}
.rubric b{display:block}
.review{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:16px;display:grid;gap:10px;font-size:.92em}
.review .row{display:grid;grid-template-columns:9em minmax(0,1fr);gap:10px;border-bottom:1px solid var(--rule);padding-bottom:8px}
.review .row:last-child{border-bottom:0}
.review .row b{color:var(--muted);font-weight:500}
.review .row span{white-space:pre-wrap;word-break:break-word}
.review .empty{color:var(--warn)}
@media (max-width:520px){.review .row{grid-template-columns:1fr;gap:2px}}
.submitbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.msg{font-size:.9em;color:var(--muted)}
.msg.ok{color:var(--ok)} .msg.warn{color:var(--warn)}
.checkq{display:grid;gap:8px;background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:14px 16px}
.checkq .fb{font-size:.9em}
@media (prefers-reduced-motion:no-preference){section.step{animation:fade .25s ease-out}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="hrow">
      <div class="brand">1979 부마, 그 열흘<small>부마 민주 항쟁 사료 탐구</small></div>
      <span class="tbadge" id="tbadge" hidden>교사 모드</span>
      <button class="tbtn" id="bigBtn" aria-pressed="false" hidden>크게 보기</button>
    </div>
    <nav class="steps" id="stepnav" aria-label="활동 단계"></nav>
  </div>
</header>

<main class="wrap" id="main"></main>

<script>
/* ============================================================
   구글 폼 연결 설정
   선생님이 만든 폼의 '미리 채워진 링크'를 받으면 아래 값을 채웁니다.
   url: .../viewform 까지의 주소 / fields: 각 항목의 entry 번호
   ============================================================ */
const FORM = {
  url: "",
  fields: { cls:"", num:"", name:"", predict:"", sources:"", compare:"", connect:"", final:"" }
};

/* ---------------- 출처 ---------------- */
const SRC = {
  kdemo397:{t:"민주화운동기념사업회 오픈아카이브, 「철통같은 유신체제를 무너뜨린 부마민주항쟁」(2020)",u:"https://archives.kdemo.or.kr/contents/view/397",s:"ok"},
  kdemoSaryo:{t:"민주화운동기념사업회, 「사료로 보는 부마항쟁」",u:"https://contents.kdemo.or.kr/sub06/sub06_05.html",s:"ok"},
  hist:{t:"국사편찬위원회 우리역사넷, 「부마 항쟁시 부산대학교 학생들의 민주 선언문」",u:"https://contents.history.go.kr/front/hm/view.do?levelId=hm_150_0140",s:"warn",n:"원문 전문 수록 페이지 (제작 중 열람 불가, 직접 확인 필요)"},
  khan2013:{t:"경향신문(2013.10.10), 「[경향으로 보는 '그때'] 1979년 10월 부마항쟁」",u:"https://www.khan.co.kr/article/201310102155165",s:"ok",n:"1979년 당시 지면을 소개한 칼럼"},
  khan2019:{t:"경향신문(2019.10.12), 「박정희 시대 '독재타도' 외친 1979 부마 사람들」",u:"https://www.khan.co.kr/article/201910121124001",s:"ok"},
  kookje:{t:"국제신문(2019.9.18), 「다시 쓰는 부마항쟁 보고서 2 <4> 조작된 진실에 피흘린 이들」",u:"https://www.kookje.co.kr/news2011/asp/newsbody.asp?code=0300&key=20190918.22006007200",s:"ok"},
  ohmy2011:{t:"오마이뉴스(2011.10.31), 김재홍 연재 「박정희 권력 평가」 6화",u:"https://www.ohmynews.com/NWS_Web/View/at_pg.aspx?CNTN_CD=A0001648335",s:"warn",n:"계엄사 법무감실 녹음테이프 정리본을 인용한 연재. 재판 기록 원본은 미확인"},
  mindle:{t:"민들레, 「박정희의 마지막 가을, 왜 온건 타협책은 거부됐나」",u:"https://www.mindlenews.com/news/articleView.html?idxno=22890",s:"ok"},
  wikiKim:{t:"위키백과, 「김재규」",u:"https://ko.wikipedia.org/wiki/%EA%B9%80%EC%9E%AC%EA%B7%9C",s:"warn",n:"2차 자료. 인용된 주간경향(2005.11.4) 기사 원문은 미확인"},
  wikiBuma:{t:"위키백과, 「부마 민주 항쟁」",u:"https://ko.wikipedia.org/wiki/%EB%B6%80%EB%A7%88_%EB%AF%BC%EC%A3%BC_%ED%95%AD%EC%9F%81",s:"warn",n:"2차 자료. 진상조사보고서로 교차 확인 필요"},
  busan2019:{t:"부산광역시, 「부마항쟁 40주년…'10월 16일' 국가기념일 지정」",u:"https://www.busan.go.kr/news/snsbusan01/view?dataNo=63353&gugun=Next",s:"ok"},
  ohmy2024:{t:"오마이뉴스, 계엄 문건에 부마항쟁을 '부산소요사태'로 표기",u:"https://www.ohmynews.com/NWS_Web/View/at_pg.aspx?CNTN_CD=A0003086940",s:"ok"},
  seoul2022:{t:"서울신문(2022.10.12), 「부마민주항쟁 43주년 진상조사보고서 공론화 토론회 개최」",u:"https://www.seoul.co.kr/news/society/2022/10/12/20221012500173",s:"ok"},
  kdemoArc:{t:"민주화운동기념사업회 오픈아카이브",u:"https://archives.kdemo.or.kr/",s:"warn",n:"교과서 수준의 일반 사실. 개별 사건 페이지로 교차 확인 권장"}
};

function srcList(keys){
  return `<div class="srcs"><span>출처</span>${keys.map(k=>{const s=SRC[k];return `<div><span class="st ${s.s}">${s.s==="ok"?"✓ 내용 확인":"△ 확인 필요"}</span> · <a href="${s.u}" target="_blank" rel="noopener">${s.t}</a>${s.n?` <span>(${s.n})</span>`:""}</div>`}).join("")}</div>`;
}

/* ---------------- 상태 ---------------- */
const KEY="buma1979_draft_v1";
let S={step:0,cls:"",num:"",name:"",pred:"",predWhy:"",a:{},cA:"",cB:"",k1:"",k2:"",fin:"",done:{}};
try{const raw=localStorage.getItem(KEY);if(raw)Object.assign(S,JSON.parse(raw))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const TEACHER = location.hash==="#teacher";

const STEPS=["탐구 질문","맥락: 타임라인·지도","사료 읽기","사료 비교","다른 항쟁과 잇기","최종 답변·제출"];

function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function ta(id,val,ph,rows){return `<textarea id="${id}" data-k="${id}" rows="${rows||4}" placeholder="${esc(ph)}">${esc(val)}</textarea><div class="count" data-count="${id}">${(val||"").length}자</div>`}
function tnote(title,items){return `<aside class="tnote" ${TEACHER?"":"hidden"}><h3>교사용 해설 · ${title}</h3><ul>${items.map(i=>`<li>${i}</li>`).join("")}</ul></aside>`}
function pager(){
  const i=S.step;
  return `<div class="pager"><button class="btn ghost" data-go="${i-1}" ${i===0?"disabled":""}>← 이전</button>${i<STEPS.length-1?`<button class="btn" data-go="${i+1}">다음: ${STEPS[i+1]} →</button>`:""}</div>`;
}

  return `<section class="step">
  <div><div class="eyebrow">6단계 · 최종 답변</div><h2>이제 탐구 질문에 답할 차례</h2></div>
  <div class="inquiry"><q>부마 민주 항쟁은 유신 체제 붕괴에 어떤 영향을 주었는가?</q></div>
  <div class="rubric">
    <div><b>① 주장</b>영향이 있었는지, 어느 정도였는지 분명하게</div>
    <div><b>② 근거</b>사료 2개 이상을 기호(A~E)로 밝히며 인용</div>
    <div><b>③ 한계</b>근거로 쓴 사료의 한계나 다른 해석 1가지</div>
  </div>
  <div class="field"><label for="fin">최종 답변</label>${ta("fin",S.fin,"예: 나는 부마 항쟁이 유신 체제 붕괴를 ○○했다고 생각한다. 사료 ○에 따르면…. 다만 사료 ○는 …라는 한계가 있다.",8)}</div>
  <p class="hint">처음 예측: <b>${esc(S.pred||"선택하지 않음")}</b> — 생각이 바뀌었다면 최종 답변에 그 이유도 써 보세요.</p>

  <h3>제출 전 확인</h3>
  <div class="review">${rows.map(r=>`<div class="row"><b>${r[0]}</b><span class="${r[2]?"empty":""}">${r[2]?"⚠ 빈 칸이 있어요 — ":""}${esc(r[1])}</span></div>`).join("")}</div>
  <div class="submitbar">
    ${FORM.url?`<a class="btn" id="submitLink" href="${esc(formUrl(b))}" target="_blank" rel="noopener" style="text-decoration:none">구글 폼으로 제출하기</a>`:`<button class="btn" disabled>구글 폼으로 제출하기</button>`}
    <button class="btn ghost" id="copyBtn">답변 전체 복사</button>
    <span class="msg" id="smsg" aria-live="polite">${FORM.url?"버튼을 누르면 답변이 채워진 구글 폼이 새 탭에서 열립니다. 폼에서 마지막으로 '제출'을 눌러야 끝납니다.":"제출 폼이 아직 연결되지 않았습니다. 선생님 안내에 따라 '답변 전체 복사' 후 붙여넣어 제출하세요."}</span>
  </div>
  <textarea id="fallback" readonly hidden rows="8"></textarea>
  ${TEACHER?`<aside class="tnote"><h3>교사용 · 구글 폼 연결 상태: ${FORM.url?"연결됨":"미연결"}</h3><ul>
    <li>구글 폼에 단답형 3개(반, 번호, 이름), 장문형 5개(처음 예측, 사료 분석, 사료 비교, 민주화 운동 연결, 최종 답변)를 이 순서로 만드세요.</li>
    <li>폼 편집 화면의 ⋮ 메뉴 → <b>미리 채워진 링크 받기</b> → 각 칸에 아무 글자나 넣고 링크를 복사해 Claude에게 보내 주시면 연결해 드립니다.</li>
    <li>평가 기준 예시 — 상: 주장 + 사료 2개 이상 + 사료의 한계 / 중: 주장 + 사료 1개 / 하: 사료 근거 없는 주장.</li>
    <li>모범 답안 방향: 항쟁은 정권의 강경 대응(계엄·위수령)과 내부 갈등을 드러내 유신 붕괴를 앞당긴 계기였다(A·D·E). 다만 10·26과의 직접 인과는 김재규 진술(E)에 크게 기대므로 신빙성 논쟁이 남는다.</li>
  </ul></aside>`:""}
  ${pager()}
  </section>`;
}

/* ---------------- 렌더 ---------------- */
const VIEWS=[step1,step2,step3,step4,step5,step6];
const main=document.getElementById("main"), nav=document.getElementById("stepnav");
function isDone(i){
  if(i===0)return !!(S.pred&&S.name);
  if(i===1)return !!S.done[1];
  if(i===2)return DOCS.every(d=>S.a[d.id]);
  if(i===3)return !!(S.cA&&S.cB);
  if(i===4)return !!(S.k1&&S.k2);
  if(i===5)return !!S.fin;
}
function renderNav(){
  nav.innerHTML=STEPS.map((s,i)=>`<button data-go="${i}" ${i===S.step?'aria-current="step"':""} class="${isDone(i)?"done":""}"><span class="n">${i+1}</span>${s}</button>`).join("");
}
function render(){
  main.innerHTML=VIEWS[S.step]();
  renderNav();
  const cur=nav.querySelector('[aria-current="step"]');if(cur)cur.scrollIntoView({block:"nearest",inline:"nearest"});
}
function go(i){if(i<0||i>=STEPS.length)return;if(S.step===1)S.done[1]=true;S.step=i;save();render();window.scrollTo({top:0})}

document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");if(g&&!g.disabled){go(+g.dataset.go);return}
  const p=e.target.closest("[data-pred]");if(p){S.pred=p.dataset.pred;save();document.querySelectorAll("[data-pred]").forEach(b=>b.setAttribute("aria-pressed",b===p));renderNav();return}
  const ev=e.target.closest("[data-ev]");if(ev){const box=ev.parentElement;const d=box.querySelector(".detail");const open=d.hidden;d.hidden=!open;ev.setAttribute("aria-expanded",open);box.toggleAttribute("open-ev",open);return}
  const o=e.target.closest("[data-orig]");if(o){const d=document.getElementById("orig"+o.dataset.orig);d.hidden=!d.hidden;o.setAttribute("aria-expanded",!d.hidden);o.textContent=d.hidden?"원문 보기":"원문 닫기";return}
  const pin=e.target.closest("[data-pl]");if(pin){showPlace(pin);return}
  const cq=e.target.closest("[data-cq]");if(cq){const ok=cq.dataset.cq==="8일";document.getElementById("cqfb").innerHTML=ok?`<span class="msg ok">맞아요. 10월 18일 계엄에서 10월 26일까지 8일입니다.</span>`:`<span class="msg warn">다시 보세요. 타임라인에서 10월 18일과 10월 26일을 확인해 보세요.</span>`;return}
  if(e.target.id==="submitLink"){e.target.href=formUrl(bundle());document.getElementById("smsg").textContent="새 탭에서 폼이 열렸다면 내용을 확인하고 '제출'을 누르세요. 열리지 않으면 '답변 전체 복사'를 쓰세요.";return}
  if(e.target.id==="copyBtn"){const t=plain(bundle());const fb=document.getElementById("fallback");const m=document.getElementById("smsg");
    (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{m.className="msg ok";m.textContent="복사했습니다. 제출 칸에 붙여넣으세요."}).catch(()=>{fb.hidden=false;fb.value=t;fb.focus();fb.select();m.className="msg warn";m.textContent="자동 복사가 막혀 있어요. 아래 칸이 선택된 상태에서 Ctrl+C를 누르세요."});return}
  if(e.target.id==="bigBtn"){const on=!document.body.classList.contains("big");document.body.classList.toggle("big",on);e.target.setAttribute("aria-pressed",on);return}
});
document.addEventListener("keydown",e=>{const pin=e.target.closest&&e.target.closest("[data-pl]");if(pin&&(e.key==="Enter"||e.key===" ")){e.preventDefault();showPlace(pin)}});
function showPlace(pin){
  document.querySelectorAll(".pin").forEach(p=>p.classList.toggle("on",p===pin));
  const pl=PLACES[pin.dataset.pl];
  document.getElementById("placebox").innerHTML=`<h3>${pl.n}</h3><p>${pl.x}</p>${srcList(pl.s)}`;
}
document.addEventListener("input",e=>{
  const k=e.target.dataset&&e.target.dataset.k;if(!k)return;
  const v=e.target.value;
  if(k.startsWith("a")&&k.length===2)S.a[k[1]]=v;else S[k]=v;
  save();
  const c=document.querySelector(`[data-count="${k}"]`);if(c)c.textContent=v.length+"자";
  const sl=document.getElementById("submitLink");if(sl)sl.href=formUrl(bundle());
});
document.addEventListener("change",e=>{if(e.target.dataset&&e.target.dataset.k)renderNav()});

if(TEACHER){document.getElementById("tbadge").hidden=false;document.getElementById("bigBtn").hidden=false}
render();
</script>
</body>
</html>
